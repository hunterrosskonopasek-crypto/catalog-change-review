name: Verify catalog review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compare example exports and exercise input errors
        run: python3 -m unittest -v
      - name: Run the packaged action on an unchanged catalog
        uses: ./
        with:
          before: examples/before.csv
          after: examples/before.csv
      - name: Verify a changed catalog triggers review
        shell: bash
        run: |
          status=0
          python3 review.py --fail-on-change examples/before.csv examples/after.csv || status=$?
          test "$status" = 1
      - name: Compare four unchanged price records sharing one part number
        uses: ./
        with:
          before: examples/price-import-key/prices.csv
          after: examples/price-import-key/prices.csv
          key-columns: |
            price_list
            part_number
            selling_unit
            effective_date
          compare-columns: usd_per_selling_unit
      - name: Read Windows line endings in workflow inputs
        uses: ./
        with:
          before: examples/price-import-key/prices.csv
          after: examples/price-import-key/prices.csv
          key-columns: ${{ fromJSON('"price_list\r\npart_number\r\nselling_unit\r\neffective_date\r\n"') }}
          compare-columns: ${{ fromJSON('"pieces_per_selling_unit\r\nusd_per_selling_unit\r\n"') }}
      - name: Verify one changed carton price is reported
        shell: bash
        run: |
          status=0
          python3 review.py --key price_list --key part_number --key selling_unit --key effective_date \
            --field usd_per_selling_unit --fail-on-change examples/price-import-key/prices.csv \
            examples/price-import-key/proposed-prices.csv > "$RUNNER_TEMP/price-review.json" || status=$?
          test "$status" = 1
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["counts"] == {"changed": 1}' "$RUNNER_TEMP/price-review.json"
